name: Doviz kuru (Ziraat Katilim satis)
on:
  schedule:
    - cron: '*/30 6-14 * * 1-5'   # 09:00-17:30 Istanbul, hafta ici
    - cron: '50 14 * * 1-5'       # 17:50 Istanbul
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: kur, cancel-in-progress: false }
jobs:
  kur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tasarim/kur_al.py
      - name: Degisiklik varsa kaydet
        run: |
          if [ -n "$(git status --porcelain docs/assets/data/kur.json)" ]; then
            git config user.name "kur-bot"; git config user.email "kur-bot@users.noreply.github.com"
            git add docs/assets/data/kur.json && git commit -m "Kur guncellemesi (otomatik)" && git pull --rebase && git push
          fi
